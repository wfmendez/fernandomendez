<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · Fernando Mendez</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050508" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--accent-1:#6C63FF;--accent-2:#00D4FF}
    html,body{height:100%}
    body{
      background:#050508;color:#f0f0f8;
      font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;text-align:center;padding:24px;overflow:hidden;
    }
    .wrap{position:relative;z-index:1;max-width:520px}
    .code{
      font-size:clamp(6rem,22vw,11rem);font-weight:900;line-height:1;
      letter-spacing:-.04em;
      background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    }
    h1{font-size:clamp(1.3rem,4vw,1.8rem);font-weight:700;margin:8px 0 14px}
    p{color:#8888aa;line-height:1.7;margin-bottom:32px}
    a.home{
      display:inline-flex;align-items:center;gap:10px;
      padding:14px 28px;border-radius:100px;font-weight:600;font-size:.9rem;
      color:#fff;text-decoration:none;
      background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
      transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;
    }
    a.home:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(108,99,255,.5)}
    .glow{
      position:fixed;width:600px;height:600px;border-radius:50%;
      background:radial-gradient(circle,rgba(108,99,255,.18),transparent 70%);
      top:-10%;right:-10%;pointer-events:none;z-index:0;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page drifted off-chain.</h1>
    <p>The link you followed doesn't exist or was moved. Let's get you back to solid ground.</p>
    <a class="home" href="/">
      Back to home
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>
</body>
</html>
